# [LAW:one-source-of-truth] The Xcode project is generated from this file; nothing in
# *.xcodeproj is hand-edited, and Info.plist keys live here as INFOPLIST_KEY_* settings.
name: OrangeDrink
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    # [LAW:one-source-of-truth] The build number is the version, so a release raises both at once and the
    # CFBundleVersion Sparkle compares always grows.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    # [LAW:one-source-of-truth] Every build is signed with the Developer ID identity and the Hardened
    # Runtime, so the app developed on runs under the rules the shipped one does. An ad-hoc build
    # cannot back the team-prefixed app group, and macOS 26.5 stops its first write to the group
    # container behind a prompt (spikes/orange-widgets-5jo.tlr/output.txt §4). The team is written
    # here alone; scripts/developer-id reads it back.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    DEVELOPMENT_TEAM: 6R988MUU27
    ENABLE_HARDENED_RUNTIME: YES
    # [LAW:one-source-of-truth] The app's bundle identifier, which the extension's identifier and
    # the app group both extend.
    APP_BUNDLE_IDENTIFIER: dev.orangedrink.$(PROJECT_NAME)
    APP_GROUP: $(TeamIdentifierPrefix)$(APP_BUNDLE_IDENTIFIER)
    # [LAW:one-source-of-truth] The privileged helper's launchd label, which is also its bundle identifier,
    # its Mach service, and its plist's name. Each build has a label of its own, so no build can stop
    # another's helper: one approval covers them all, and a deleted build's record wedges only its own job
    # (orange-admin-helper-b2q.qm0, cmt-19709fc0). HELPER_COPY names the build: the Makefile passes one per
    # derived-data directory, scripts/dmg passes it empty, so every installed copy of the app users install
    # shares the one fixed label (HelperRegistration holds the record for all of them), and a build outside
    # make gets this .xcode.
    HELPER_COPY: .xcode
    HELPER_LABEL: $(APP_BUNDLE_IDENTIFIER).Helper$(HELPER_COPY).$(CONFIGURATION)
  configs:
    # Xcode adds get-task-allow to every build it signs, so a debugger can attach under the Hardened
    # Runtime; the notary service refuses an app that carries it, and requires the secure timestamp,
    # which Debug builds skip so they need no network. [LAW:one-source-of-truth] OTHER_CODE_SIGN_FLAGS
    # says so for everything signed, Xcode's signing and the "Sign Sparkle's helpers" phase alike.
    Debug:
      OTHER_CODE_SIGN_FLAGS: --timestamp=none
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # [LAW:one-source-of-truth] By commit, so the source tree decides what a fresh build directory
    # resolves: the generated project and its Package.resolved are not committed, and a release signs what
    # resolves here. GRDB has no dependencies of its own.
    revision: b83108d10f42680d78f23fe4d4d80fc88dab3212 # 7.11.1
  Sparkle:
    # The commit's Package.swift pins the artifact's checksum, so this one line decides the app's framework and
    # the release tools scripts/appcast runs.
    url: https://github.com/sparkle-project/Sparkle
    revision: ab7d71291238df6e0492143b120c9b696a35f603 # 2.10.1
  ViewInspector:
    # Unit tests press SwiftUI controls with it, with no window (docs/testing.md). Tests only, never the app.
    url: https://github.com/nalexn/ViewInspector
    revision: 2dacb6e514be19379c605a5a11564d0f3fea89d9 # 0.10.5
targets:
  OrangeDrink:
    type: application
    platform: macOS
    sources: [Sources/OrangeDrink, Sources/Shared, Sources/HelperInterface]
    dependencies:
      - package: GRDB
      - package: Sparkle
      - target: OrangeDrinkWidgets
      - target: OrangeDrinkHelper
        copy:
          destination: executables
    # [LAW:one-source-of-truth] The helper's launchd plist, written from the build settings alone; Xcode
    # signs the app after this phase, so the app's seal covers it.
    postCompileScripts:
      - name: Embed the helper's launchd plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(HELPER_LABEL).plist
        script: |
          set -euo pipefail
          plist="$SCRIPT_OUTPUT_FILE_0"
          # The whole directory, since a plist left by a build under another label would make two.
          rm -rf "$(dirname "$plist")"
          mkdir -p "$(dirname "$plist")"
          plutil -create xml1 "$plist"
          plutil -insert Label -string "$HELPER_LABEL" "$plist"
          plutil -insert BundleProgram -string "Contents/MacOS/OrangeDrinkHelper" "$plist"
          # JSON values, because plutil reads the dots in a key path as nesting and the label is all dots.
          plutil -insert MachServices -json "{\"$HELPER_LABEL\": true}" "$plist"
          plutil -insert AssociatedBundleIdentifiers -json "[\"$APP_BUNDLE_IDENTIFIER\"]" "$plist"
    # Sparkle's artifact arrives ad-hoc signed, and copying it signs only the framework, so the notary service
    # would refuse what is inside it. Inside out, with no --deep and no --preserve-metadata: Autoupdate's
    # artifact signature carries an application identifier that taskgated refuses without a provisioning
    # profile. Embedding the framework is what writes the input, so a framework embedded again is never left
    # ad-hoc; running on every build instead would change a framework the app's last signature sealed, with
    # nothing to make Xcode sign the app again. The app's signature comes after every phase and covers the result.
    postBuildScripts:
      - name: Sign Sparkle's helpers
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/Sparkle
        outputFiles:
          - $(DERIVED_FILE_DIR)/sparkle-helpers-signed
        script: |
          set -euo pipefail
          framework="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          # The XPC services are for a sandboxed app.
          rm -rf "$framework/XPCServices" "$framework/Versions/B/XPCServices"
          for code in "$framework/Versions/B/Autoupdate" "$framework/Versions/B/Updater.app" "$framework"; do
            # shellcheck disable=SC2086 # OTHER_CODE_SIGN_FLAGS is a list of flags.
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime $OTHER_CODE_SIGN_FLAGS "$code"
          done
          touch "$SCRIPT_OUTPUT_FILE_0"
    # Sparkle's keys. Automatic checks are off, so it checks only when the panel's row asks and never prompts
    # about checking; with the key absent it would ask at the second launch. SUPublicEDKey is the half of the
    # signing key docs/releasing.md keeps.
    info:
      path: build/generated/OrangeDrink-Info.plist
      properties:
        SUFeedURL: https://github.com/promptctl/orange-drink/releases/latest/download/appcast.xml
        SUPublicEDKey: x0UMWgGQxL8vJKJttpBtmeAyfnEkbMLmj1NyZTL2XCs=
        SUEnableAutomaticChecks: false
    # The app stays unsandboxed; it shares the group with its sandboxed widget extension.
    entitlements:
      path: build/generated/OrangeDrink.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Reads the battery levels of your paired Bluetooth devices."
    scheme:
      testTargets: [OrangeDrinkTests]
  OrangeDrinkWidgets:
    type: app-extension
    platform: macOS
    sources: [Sources/OrangeDrinkWidgets, Sources/Shared]
    info:
      path: build/generated/OrangeDrinkWidgets-Info.plist
      properties:
        CFBundleDisplayName: $(PROJECT_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/generated/OrangeDrinkWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).Widgets
  # The root helper the app registers with SMAppService. It carries no entitlements: with the ones Xcode
  # injects into a Debug build, taskgated refuses it and launchd never runs it (orange-admin-helper-b2q.qm0,
  # cmt-4bc4dac4 §1). Its Info.plist is embedded in its own signature, which is where it reads it from.
  OrangeDrinkHelper:
    type: tool
    platform: macOS
    sources: [Sources/OrangeDrinkHelper, Sources/HelperInterface]
    info:
      path: build/generated/OrangeDrinkHelper-Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        OrangeDrinkAppIdentifier: $(APP_BUNDLE_IDENTIFIER)
        OrangeDrinkAdmitsDebuggableCallers: $(HELPER_ADMITS_DEBUGGABLE_CALLERS)
    settings:
      # A caller with get-task-allow can be attached to and driven by other code of the same user. Only a
      # Debug helper admits one, since its Debug app carries it; a Release helper, the shipped one included,
      # refuses it.
      configs:
        Debug:
          HELPER_ADMITS_DEBUGGABLE_CALLERS: "YES"
        Release:
          HELPER_ADMITS_DEBUGGABLE_CALLERS: "NO"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HELPER_LABEL)
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # get-task-allow comes from the base entitlements; com.apple.application-identifier from a tool's
        # required entitlements. taskgated refuses the second without a provisioning profile.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENTITLEMENTS_REQUIRED: NO
  # Calls the helper the way the app does, for HelperLive's refusal checks; it never ships.
  HelperCheckClient:
    type: tool
    platform: macOS
    sources: [Tests/HelperCheckClient, Sources/HelperInterface]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).HelperCheckClient
  OrangeDrinkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OrangeDrinkTests]
    dependencies:
      - target: OrangeDrink
      - package: ViewInspector
      - target: HelperCheckClient
        # A test bundle embeds nothing unless told to; without this the copy below never happens.
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)Tests
