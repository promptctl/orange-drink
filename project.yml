# [LAW:one-source-of-truth] The Xcode project is generated from this file; nothing in
# *.xcodeproj is hand-edited, and Info.plist keys live here as INFOPLIST_KEY_* settings.
name: OrangeDrink
options:
  bundleIdPrefix: dev.orangedrink
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    # [LAW:one-source-of-truth] Every build is signed the way a release is - Hardened Runtime and a
    # secure timestamp - so the app developed on is the app that ships. A release changes only the
    # identity (scripts/dmg); an ad-hoc signature takes no timestamp and codesign skips it.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.9.0
targets:
  OrangeDrink:
    type: application
    platform: macOS
    sources: [Sources/OrangeDrink]
    dependencies:
      - package: GRDB
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Reads the battery levels of your paired Bluetooth devices."
    scheme:
      testTargets: [OrangeDrinkTests]
  OrangeDrinkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OrangeDrinkTests]
    dependencies:
      - target: OrangeDrink
