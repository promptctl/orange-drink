# [LAW:one-source-of-truth] The Xcode project is generated from this file; nothing in
# *.xcodeproj is hand-edited, and Info.plist keys live here as INFOPLIST_KEY_* settings.
name: OrangeDrink
options:
  bundleIdPrefix: dev.orangedrink
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    # [LAW:one-source-of-truth] Every build is signed with the Hardened Runtime and a secure
    # timestamp, so the app developed on runs under the rules the shipped one does; an ad-hoc
    # signature takes no timestamp and codesign skips it. A release supplies only the Developer ID
    # identity (scripts/dmg), and the Makefile reads the team from it.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
  configs:
    # Xcode adds get-task-allow to every build it signs, so a debugger can attach under the Hardened
    # Runtime; the notary service refuses an app that carries it.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # [LAW:one-source-of-truth] Exact, so the source tree decides what a fresh build directory
    # resolves; GRDB is the only package and has no dependencies of its own.
    exactVersion: 7.11.1
targets:
  OrangeDrink:
    type: application
    platform: macOS
    sources: [Sources/OrangeDrink]
    dependencies:
      - package: GRDB
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Reads the battery levels of your paired Bluetooth devices."
    scheme:
      testTargets: [OrangeDrinkTests]
  OrangeDrinkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OrangeDrinkTests]
    dependencies:
      - target: OrangeDrink
