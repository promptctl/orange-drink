# A host app and its widget, signed the way the app's project.yml and `make release` sign it.
# run.sh supplies the signing identity; nothing else differs between its two variants.
# [LAW:one-source-of-truth] The Info.plist and entitlements files are generated from this file
# into build/, so this is the one place the spike's bundle shape is written.
name: OrangeWidgetSpike
options:
  bundleIdPrefix: dev.orangedrink
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  OrangeWidgetSpike:
    type: application
    platform: macOS
    sources: [Host, Shared]
    dependencies:
      - target: OrangeWidgetSpikeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orangedrink.widgetspike
    info:
      path: build/generated/Host-Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: build/generated/Host.entitlements
      properties:
        com.apple.security.application-groups: [6R988MUU27.dev.orangedrink.widgetspike]
  OrangeWidgetSpikeWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orangedrink.widgetspike.widget
    info:
      path: build/generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: OrangeWidgetSpike
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/generated/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [6R988MUU27.dev.orangedrink.widgetspike]
