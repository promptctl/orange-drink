# The toolchain every workflow builds with, chosen here once so the test run and the release build cannot
# drift apart. [LAW:one-source-of-truth]
#
# Xcode is the macos-26 image's 26.6: the one the project builds with on a developer's Mac, named because the
# image's default moves under us. XcodeGen is pinned by its release artifact's SHA-256, not whatever Homebrew
# ships on the day.
name: toolchain
description: Select the project's Xcode and install its pinned XcodeGen.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        XCODE: /Applications/Xcode_26.6.app/Contents/Developer
        XCODEGEN_VERSION: 2.46.0
        XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      run: |
        echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
        curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
        echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
        echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
